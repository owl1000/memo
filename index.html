<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f8f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161b1c" media="(prefers-color-scheme: dark)">
<title>Memo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
  --bg:#f6f8f8;--surface:#ffffff;--surface2:#eef3f3;--border:#d9e1e2;--border2:#c3cfd1;
  --text:#22302f;--muted:#6f878c;--accent:#2f6f73;--accent-weak:#e3efee;--danger:#b23b3b;
  --link:#185FA5;--mark:#fff1a8;--sel:#d6ebe9;--read:#fff3c4;
  --pv-fs:16px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161b1c;--surface:#1e2526;--surface2:#263031;--border:#34403f;--border2:#46524f;
  --text:#e3eaea;--muted:#93a5a7;--accent:#7fb8b5;--accent-weak:#24393a;--danger:#e07a7a;
  --link:#8fb8e8;--mark:#5a4d12;--sel:#2c4746;--read:#4a4320;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;-webkit-text-size-adjust:100%;overflow:hidden;}
button,input,select,textarea{font-family:var(--font);color:var(--text);}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.ibtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--accent);flex:none}
.ibtn:active{background:var(--accent-weak)}
.ibtn.on{background:var(--accent-weak)}
.hide{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t);padding-left:var(--safe-l);padding-right:var(--safe-r);}
/* tabs */
#tabs{display:flex;align-items:center;gap:6px;padding:0 10px;height:40px;border-bottom:1px solid var(--border);background:var(--bg);flex:none}
.tab{height:40px;padding:0 8px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.tab.small{font-size:12.5px}
.tabsep{width:1px;height:16px;background:var(--border2)}
#tabs .sp{flex:1}
#sideToggle{font-size:12.5px;color:var(--muted);padding:4px 8px;border:1px solid var(--border);border-radius:8px}
#sideToggle.on{color:var(--accent);border-color:var(--accent)}
/* banners */
.banner{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;padding:6px 12px;font-size:13px;background:var(--accent-weak);border-bottom:1px solid var(--border);flex:none}
.banner.warn{background:#fbecec;color:#7a2424}
@media (prefers-color-scheme:dark){.banner.warn{background:#3a2323;color:#f2c4c4}}
.banner .sp{flex:1}
.banner button{font-size:12.5px;padding:5px 9px;border:1px solid var(--border2);border-radius:8px;background:var(--surface)}
/* layout */
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex}
#side{width:300px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg);min-height:0}
#editor{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);min-height:0;position:relative}
body.noside #side{display:none}
body.narrow #side{width:100%;border-right:0}
body.narrow #notesView #editor{position:absolute;inset:0;transform:translateX(100%);transition:transform .22s ease;z-index:5}
body.narrow.screen-note #notesView #editor{transform:none}
body.narrow #sideToggle{display:none}
/* list */
.listhead{display:flex;align-items:center;gap:4px;padding:6px 6px 2px 14px;flex:none}
.listhead h1{font-size:22px;margin:0;flex:1;font-weight:700;color:var(--text)}
.searchrow{display:flex;gap:8px;padding:4px 12px 8px;flex:none}
.searchrow input{flex:1;min-width:0;height:38px;border:1px solid var(--border);border-radius:10px;padding:0 10px;font-size:16px;background:var(--surface)}
.searchrow select{height:38px;border:1px solid var(--border);border-radius:10px;padding:0 6px;font-size:14px;background:var(--surface)}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(90px + var(--safe-b));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sec{font-size:12px;color:var(--muted);padding:12px 16px 4px;letter-spacing:.04em}
.frow{display:flex;align-items:center;min-height:44px;padding:0 4px 0 10px;color:var(--muted);font-size:14px;border-top:1px solid var(--border)}
.frow .fname{flex:1;display:flex;align-items:center;gap:6px;min-height:44px;font-weight:600;color:var(--text)}
.frow .chev{width:18px;height:18px;transition:transform .15s}
.frow.closed .chev{transform:rotate(-90deg)}
.frow .cnt{font-weight:400;color:var(--muted);font-size:12.5px}
.nrow{display:block;width:100%;text-align:left;padding:10px 16px;border-top:1px solid var(--border);min-height:52px}
.nrow.inf{padding-left:30px}
.nrow.cur{background:var(--sel)}
.nrow .t{font-size:15.5px;display:flex;align-items:center;gap:6px;overflow:hidden}
.nrow .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .s{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .pin{width:14px;height:14px;flex:none;color:var(--accent)}
.nrow mark{background:var(--mark);color:inherit}
.empty{padding:30px 16px;color:var(--muted);font-size:14px;text-align:center}
#fab{position:absolute;right:calc(18px + var(--safe-r));bottom:calc(18px + var(--safe-b));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--surface);display:flex;align-items:center;justify-content:center;z-index:4}
#fab .ico{width:26px;height:26px;stroke-width:2}
body:not(.narrow) #fab{position:absolute;left:236px;right:auto;width:46px;height:46px}
body:not(.narrow).noside #fab{display:none}
/* editor */
.ebar{display:flex;align-items:center;gap:2px;padding:0 4px;height:50px;border-bottom:1px solid var(--border);flex:none}
.ebar .sp{flex:1}
#backBtn{display:none;align-items:center;gap:0;color:var(--accent);font-size:16px;height:44px;padding:0 8px 0 2px}
body.narrow #backBtn{display:inline-flex}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:9px;overflow:hidden;margin-left:4px}
.seg button{font-size:13.5px;padding:0 12px;height:32px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--surface)}
body.narrow .seg .wideonly{display:none}
.titlerow{padding:10px 16px 2px;flex:none}
#title{width:100%;border:0;outline:0;font-size:20px;font-weight:700;background:transparent;padding:4px 0}
#title::placeholder{color:var(--muted);font-weight:400}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 16px 8px;font-size:12.5px;color:var(--muted);flex:none;border-bottom:1px solid var(--border)}
.meta select{font-size:13px;border:1px solid var(--border);border-radius:7px;background:var(--surface);height:28px;max-width:46vw}
.meta .dup{color:var(--danger);font-weight:700}
#fmt{display:flex;gap:2px;overflow-x:auto;padding:4px 6px;border-bottom:1px solid var(--border);background:var(--surface2);flex:none;scrollbar-width:none}
#fmt::-webkit-scrollbar{display:none}
#fmt button{min-width:40px;height:36px;padding:0 8px;border-radius:8px;font-size:14px;color:var(--text);flex:none;white-space:nowrap}
#fmt button:active{background:var(--accent-weak)}
#fmt .fsep{width:1px;background:var(--border2);margin:6px 3px;flex:none}
body.narrow #fmt{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--border);border-bottom:0;padding-bottom:4px}
body.narrow:not(.kb) #fmt{display:none}
.panes{flex:1;min-height:0;display:flex}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.pane+.pane{border-left:1px solid var(--border)}
body.m-view .pane+.pane{border-left:0}
.phead{display:none;align-items:center;height:34px;padding:0 4px 0 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);flex:none}
.phead .sp{flex:1}
.phead .ibtn{width:34px;height:34px}
.phead .ico{width:18px;height:18px}
body.m-split .phead{display:flex}
body.m-split #copyBtn{display:none}
body.m-edit #pvPane,body.m-view #srcPane{display:none}
#src{flex:1;width:100%;border:0;outline:0;resize:none;font-size:16px;line-height:1.75;padding:14px 16px calc(60px + var(--safe-b));background:var(--surface)}
#pvWrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#pv{padding:16px 18px 24px;font-size:var(--pv-fs);line-height:1.8;overflow-wrap:anywhere;word-break:normal}
.backlinks{padding:10px 18px calc(30px + var(--safe-b));font-size:13px;color:var(--muted);border-top:1px solid var(--border);margin:0 0 0}
.backlinks a{color:var(--accent);text-decoration:underline;margin-right:12px;cursor:pointer}
.noNote{position:absolute;inset:50px 0 0;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface);z-index:3}
/* readonly (other tab) */
body.ro #src,body.ro #title{background:var(--surface2)}
/* preview: standard */
#pv h1,#pv h2,#pv h3,#pv h4,#pv h5,#pv h6{line-height:1.45;margin:1.1em 0 .5em}
#pv>*:first-child{margin-top:0}
#pv h1{font-size:1.5em;color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:.2em}
#pv h2{font-size:1.25em;background:var(--accent-weak);border-left:5px solid var(--accent);padding:.2em .5em}
#pv h3{font-size:1.1em;color:var(--accent)}
#pv h4{font-size:1em}
#pv h4::before{content:"";display:inline-block;width:.5em;height:.5em;background:var(--accent);margin-right:.45em;vertical-align:.12em}
#pv h5{font-size:.95em;color:var(--muted)}
#pv h5::before{content:"";display:inline-block;width:.45em;height:.45em;border:1.5px solid var(--accent);border-radius:50%;margin-right:.45em;vertical-align:.1em}
#pv h6{font-size:1em}
#pv p{margin:.5em 0}
#pv ul,#pv ol{margin:.4em 0;padding-left:1.5em}
#pv li{margin:.15em 0}
#pv li.task{list-style:none;margin-left:-1.3em}
#pv li.task input{width:1.05em;height:1.05em;margin:0 .4em 0 0;vertical-align:-.15em;accent-color:var(--accent)}
#pv blockquote{margin:.6em 0;padding:.3em .9em;background:var(--surface2);border-left:3px solid var(--border2);color:var(--muted)}
#pv blockquote p{margin:.2em 0}
#pv code{background:var(--surface2);padding:.1em .35em;border-radius:4px;font-size:.92em}
#pv pre{background:var(--surface2);padding:.7em .9em;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92em;line-height:1.6}
#pv pre code{background:none;padding:0}
#pv hr{border:0;border-top:1px solid var(--border2);margin:1.2em 0}
#pv .tbl{overflow-x:auto;margin:.6em 0}
#pv table{border-collapse:collapse;font-size:.95em;min-width:50%}
#pv th,#pv td{border:1px solid var(--border);padding:.3em .6em;text-align:left;vertical-align:top}
#pv th{background:var(--accent-weak)}
#pv mark{background:var(--mark);color:inherit;padding:0 .1em}
#pv a.ext{color:var(--link);text-decoration:underline}
#pv a.wl{color:var(--accent);text-decoration:underline;cursor:pointer}
#pv a.wl.missing{text-decoration:underline dotted;opacity:.8}
#pv .docdate{display:none}
#pv .snt{border-radius:3px}
#pv .snt.reading{background:var(--read)}
body.tts #pv .snt{cursor:pointer}
/* preview: gray */
#pv.st-gray{--g-text:#222;--g-strong:#444;--g-thin:#ccc;--g-box:#bbb}
@media (prefers-color-scheme:dark){#pv.st-gray{--g-text:#ddd;--g-strong:#bbb;--g-thin:#555;--g-box:#666}}
#pv.st-gray{color:var(--g-text)}
#pv.st-gray h1{color:var(--g-strong);border-bottom-color:var(--g-strong)}
#pv.st-gray h2{background:none;border-left:5px solid var(--g-strong);border-bottom:1px solid var(--g-thin);color:var(--g-text)}
#pv.st-gray h3{color:var(--g-text)}
#pv.st-gray h4::before{background:var(--g-strong)}
#pv.st-gray h5{color:#666}
#pv.st-gray h5::before{border-color:var(--g-strong)}
#pv.st-gray th{background:none;font-weight:700}
#pv.st-gray table{border-top:1.5px solid var(--g-strong);border-bottom:1.5px solid var(--g-strong)}
#pv.st-gray th,#pv.st-gray td{border:0;border-bottom:1px solid var(--g-thin)}
#pv.st-gray blockquote{background:none;border-left:2px solid var(--g-box);color:var(--g-text)}
#pv.st-gray code,#pv.st-gray pre{background:none;border:1px solid var(--g-box)}
#pv.st-gray pre code{border:0}
#pv.st-gray mark{background:none;font-weight:700;text-decoration:underline}
#pv.st-gray a.ext{color:var(--g-text)}
#pv.st-gray a.wl{color:var(--g-text)}
/* preview: document (A) */
#pv.st-doc{counter-reset:h2;font-size:calc(var(--pv-fs) * .9);line-height:1.95;color:var(--text)}
#pv.st-doc .docdate{display:block;text-align:right;font-size:.85em;color:var(--muted);margin:0 0 .4em}
#pv.st-doc h1{color:var(--text);border-bottom:2px solid var(--text);font-size:1.45em;padding-bottom:.15em}
#pv.st-doc h2{background:none;border-left:0;padding:0 0 .1em;border-bottom:1px solid var(--border2);font-size:1.15em;color:var(--text)}
#pv.st-doc h2::before{counter-increment:h2;content:counter(h2) ".\3000"}
#pv.st-doc h3,#pv.st-doc h4,#pv.st-doc h5{color:var(--text)}
#pv.st-doc h4::before{background:var(--text)}
#pv.st-doc h5::before{border-color:var(--text)}
#pv.st-doc table{border-top:1.5px solid var(--text);border-bottom:1.5px solid var(--text);width:100%}
#pv.st-doc th,#pv.st-doc td{border:0;border-bottom:1px solid var(--border)}
#pv.st-doc th{background:none;font-weight:700;border-bottom:1px solid var(--border2)}
#pv.st-doc blockquote{background:none;border-left:2px solid var(--border2)}
#pv.st-doc code,#pv.st-doc pre{background:none;border:1px solid var(--border)}
#pv.st-doc pre code{border:0}
#pv.st-doc a.wl{color:var(--text)}
/* tts bar */
#ttsBar{position:absolute;left:10px;right:10px;bottom:calc(10px + var(--safe-b));display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:3px 6px;z-index:12}
#ttsBar select{height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:14px;margin-left:4px}
#ttsBar .sp{flex:1}
body.tts .backlinks{padding-bottom:calc(90px + var(--safe-b))}
/* templates view */
#tplView{background:var(--surface)}
#tplSide{width:280px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg)}
#tplList{flex:1;overflow-y:auto}
#tplEdit{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 16px;gap:8px;overflow-y:auto}
#tplEdit label{font-size:12.5px;color:var(--muted)}
#tplEdit input,#tplEdit textarea{font-size:16px;border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--surface);width:100%}
#tplEdit textarea{min-height:260px;flex:1;resize:vertical;line-height:1.7}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:calc(10px + var(--safe-b))}
.btn{height:40px;padding:0 14px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);font-size:14px}
.btn.pri{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn.dan{color:var(--danger)}
body.narrow #tplView{flex-direction:column;overflow-y:auto}
body.narrow #tplSide{width:auto;border-right:0;border-bottom:1px solid var(--border);max-height:38%}
/* menu / sheet / dialog */
#ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.18)}
#ov.clear{background:transparent}
.menu{position:fixed;z-index:51;background:var(--surface);border:1px solid var(--border2);border-radius:12px;min-width:220px;max-width:min(320px,92vw);max-height:80vh;overflow-y:auto;padding:4px 0}
.menu.sheet{left:8px;right:8px;bottom:calc(8px + var(--safe-b));max-width:none;border-radius:14px}
.mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:0 16px;min-height:44px;font-size:15px}
.mi:active{background:var(--accent-weak)}
.mi .ck{width:16px;color:var(--accent)}
.mi.dan{color:var(--danger)}
.mi.sub{font-size:12px;color:var(--muted);min-height:28px;padding-top:6px}
.msep{height:1px;background:var(--border);margin:4px 0}
.mrow{display:flex;gap:8px;padding:6px 16px;align-items:center;font-size:14px;color:var(--muted)}
.mrow .btn{height:36px;min-width:56px}
.dlg{position:fixed;z-index:52;left:50%;top:22%;transform:translateX(-50%);width:min(420px,92vw);background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:16px}
.dlg h3{margin:0 0 8px;font-size:16px}
.dlg p{margin:0 0 10px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.dlg label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
.dlg input{width:100%;height:40px;font-size:16px;border:1px solid var(--border2);border-radius:9px;padding:0 10px;background:var(--surface)}
.dlg .btnrow{justify-content:flex-end;margin-top:14px;padding:0}
#toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:.92}
body.narrow select{font-size:16px!important}
body.narrow.screen-note #bnBackup{display:none}
/* print */
@page{size:A4;margin:16mm;@bottom-center{content:counter(page) " / " counter(pages);font-size:9pt;color:#666}}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface2:#f3f6f6;--border:#d9e1e2;--border2:#c3cfd1;--text:#22302f;--muted:#6f878c;--accent:#2f6f73;--accent-weak:#e3efee;--link:#185FA5;--mark:#fff1a8;--read:transparent}
  #pv.st-gray{--g-text:#222;--g-strong:#444;--g-thin:#ccc;--g-box:#bbb}
  html,body{height:auto;overflow:visible;background:#fff}
  #app{position:static;padding:0;display:block}
  #tabs,.banner,#side,.ebar,.titlerow,.meta,#fmt,#srcPane,.phead,.backlinks,#ttsBar,#fab,#tplView,.noNote,#toast{display:none!important}
  #views,.view,#editor,.panes,#pvPane,#pvWrap{position:static!important;display:block!important;overflow:visible!important;transform:none!important;height:auto!important}
  .pane+.pane{border-left:0!important}
  #pv{padding:0;--pv-fs:10.5pt}
  #pv .tbl{overflow:visible}
  #pv a.ext[data-u]::after{content:"（" attr(data-u) "）";font-size:.8em;color:#555}
  #pv h1,#pv h2,#pv h3{break-after:avoid}
  #pv tr,#pv pre,#pv blockquote{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app">
  <div id="tabs">
    <button class="tab on" id="tabNotes">ノート</button>
    <span class="tabsep"></span>
    <button class="tab small" id="tabTpl">テンプレート集</button>
    <span class="sp"></span>
    <button id="sideToggle" class="on" title="サイドバー（Ctrl+Alt+S）">サイドバー</button>
  </div>
  <div id="bnUpdate" class="banner hide"><span>新しい版があります。</span><span class="sp"></span><button id="bnUpdateBtn">更新する</button></div>
  <div id="bnOther" class="banner warn hide"><span>別の画面でこのアプリが編集されました。この画面では保存を止めています。</span><span class="sp"></span><button onclick="location.reload()">再読み込みする</button></div>
  <div id="bnBackup" class="banner hide"><span id="bnBackupMsg"></span><span class="sp"></span><button id="bnBackupGo">iCloudへ送る</button><button id="bnBackupLater">今日は表示しない</button></div>
  <div id="views">
    <div class="view" id="notesView">

function mergeData(inc) {

    const loc = D[kind]; const map = new Map(loc.map(x => [x.id, x]));
    const ltomb = D.deleted[kind]; const itomb = (inc.deleted && inc.deleted[kind]) || {};
    for (const it of inc[kind] || []) {

    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(h.buffer, name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true); c.setUint16(12, dt, true); c.setUint16(14, dd, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(c.buffer, name);
    off += 30 + name.length + data.length;
  }
  const csize = central.reduce((s, b) => s + (b.byteLength || b.length), 0);
  const e = new DataView(new ArrayBuffer(22)); e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, e.buffer], { type: 'application/zip' });
}
async function readZip(buf) {
  const v = new DataView(buf); const u8 = new Uint8Array(buf); let eo = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) if (v.getUint32(i, true) === 0x06054b50) { eo = i; break; }
  if (eo < 0) throw new Error('zip');
  const cnt = v.getUint16(eo + 10, true); let p = v.getUint32(eo + 16, true); const out = [];
  const utf = new TextDecoder('utf-8'); let sj = null; try { sj = new TextDecoder('shift_jis'); } catch {}
  for (let k = 0; k < cnt; k++) {
    const flag = v.getUint16(p + 8, true), method = v.getUint16(p + 10, true), csz = v.getUint32(p + 20, true), nl = v.getUint16(p + 28, true), xl = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true), lo = v.getUint32(p + 42, true);
    const nb = u8.slice(p + 46, p + 46 + nl); const name = (flag & 0x800 || !sj) ? utf.decode(nb) : sj.decode(nb);
    p += 46 + nl + xl + cl;
    if (name.endsWith('/')) continue;
    const ds = lo + 30 + v.getUint16(lo + 26, true) + v.getUint16(lo + 28, true);
    let data = u8.slice(ds, ds + csz);
    if (method === 8) { const s = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')); data = new Uint8Array(await new Response(s).arrayBuffer()); }
    else if (method !== 0) continue;
    out.push({ name, text: utf.decode(data) });
  }
  return out;
}
$('#fileZip').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let ents; try { ents = await readZip(await f.arrayBuffer()); } catch { toast('ZIPを読めませんでした'); return; }
  let cnt = 0, tc = 0;
  for (const en of ents) {
    if (!/\.(md|markdown|txt)$/i.test(en.name) || /(^|\/)(__MACOSX|\.)/.test(en.name)) continue;
    let p = en.name.split('/'); if (p.length > 1 && /^Memo書き出し_/.test(p[0])) p = p.slice(1);
    if (p.length === 1) { addImported(p[0], en.text); cnt++; }
    else if (p.length === 2) { if (p[0] === '99_Template') { if (parseTplFile(p[1], en.text)) tc++; } else { addImported(p[1], en.text, folderIdByName(p[0])); cnt++; } }
  }
  saveNow(); renderList(); toast(`ノート ${cnt} 件・テンプレート ${tc} 件を読み込みました`);
});
function exportEntries() {
  const used = new Set(); const files = [];
  const uniq = (dir, base) => { let n = base, i = 2; while (used.has(dir + '/' + n + '.md')) n = `${base} (${i++})`; used.add(dir + '/' + n + '.md'); return n + '.md'; };
  for (const n of D.notes) {
    const f = n.folder && folderById(n.folder); const dir = f ? safeName(f.name) : '';
    files.push({ dir, name: uniq(dir, safeName(dispTitle(n))), text: n.body || '' });
  }
  for (const t of D.templates) files.push({ dir: '99_Template', name: uniq('99_Template', safeName(t.name)), text: `---\ntitle: "${(t.title || '').replace(/"/g, '\\"')}"\n---\n` + (t.body || '') });
  return files;
}
async function exportAll() {
  saveNow();
  const root = `Memo書き出し_${today()}`; const files = exportEntries();
  if (window.showDirectoryPicker && !isIOS) {
    let dir; try { dir = await showDirectoryPicker({ mode: 'readwrite' }); } catch (e) { return; }
    try {
      let rn = root, i = 2; while (await dir.getDirectoryHandle(rn).then(() => true, () => false)) rn = `${root} (${i++})`;
      const top = await dir.getDirectoryHandle(rn, { create: true });
      for (const f of files) {
        const d = f.dir ? await top.getDirectoryHandle(f.dir, { create: true }) : top;
        const h = await d.getFileHandle(f.name, { create: true }); const w = await h.createWritable(); await w.write(f.text); await w.close();
      }
      markBackup(); toast(`${files.length} 件を書き出しました`); afterExportAll(false); return;
    } catch (e) { toast('書き出しに失敗しました'); return; }
  }
  const zip = makeZip(files.map(f => ({ name: root + '/' + (f.dir ? f.dir + '/' : '') + f.name, text: f.text })));
  if (await saveFile(zip, root + '.zip', [{ description: 'ZIP', accept: { 'application/zip': ['.zip'] } }])) { markBackup(); afterExportAll(true); }
}
async function afterExportAll(isZip) {
  const r = await dialog({ title: '書き出しました', message: 'アプリ内のノートとフォルダを、すべて消去しますか？' + (isZip ? '\n（ZIPが保存できたかを確かめてから消去してください）' : ''), buttons: [{ label: 'すべて消去する', value: 'clear', danger: true }, { label: '消去しない', value: false, pri: true }] });
  if (r.button !== 'clear') return;
  if (!(await confirmDlg('本当にすべてのノートとフォルダを消去しますか？\n元に戻せません。', '消去する', true))) return;
  const now = Date.now();
  for (const n of D.notes) D.deleted.notes[n.id] = now; for (const f of D.folders) D.deleted.folders[f.id] = now;
  D.notes = []; D.folders = []; cur = null; saveNow(); goList(); openNote(null); toast('消去しました');
}
function exportCsv(visibleOnly) {
  const notes = visibleOnly ? lastVisibleIds.map(noteById).filter(Boolean) : sortNotes(D.notes.slice());
  const cell = s => { s = String(s ?? ''); if (/^[=+\-@]/.test(s)) s = ' ' + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = [['タイトル', 'フォルダ', '作成日', '更新日', '文面'].map(cell).join(',')];
  for (const n of notes) { const f = n.folder && folderById(n.folder); rows.push([dispTitle(n), f ? f.name : '', fmtDT(n.created), fmtDT(n.updated), n.body || ''].map(cell).join(',')); }
  saveFile(new Blob(['\uFEFF' + rows.join('\r\n')], { type: 'text/csv' }), `メモ一覧_${today()}.csv`, [{ description: 'CSV', accept: { 'text/csv': ['.csv'] } }]);
}

/* ===== backup reminder ===== */
function checkBackup() {
  const b = $('#bnBackup');
  if (localStorage.getItem(DKEY) === today() || !D.notes.length) { b.classList.add('hide'); return; }
  const last = +localStorage.getItem(BKEY) || 0;
  let first = +localStorage.getItem('memo-first-run') || 0;
  if (!first) { first = Date.now(); localStorage.setItem('memo-first-run', String(first)); }
  if (!last && Date.now() - first < 7 * 86400000) { b.classList.add('hide'); return; }
  const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
  if (last && days < 7) { b.classList.add('hide'); return; }
  $('#bnBackupMsg').textContent = last ? `前回のバックアップから${days}日たっています。` : 'まだバックアップをしていません。';
  b.classList.remove('hide');
}
$('#bnBackupGo').addEventListener('click', backupExport);
$('#bnBackupLater').addEventListener('click', () => { localStorage.setItem(DKEY, today()); checkBackup(); });

/* ===== templates ===== */
function showTab(t) {
  $('#tabNotes').classList.toggle('on', t === 'notes'); $('#tabTpl').classList.toggle('on', t === 'tpl');
  $('#notesView').classList.toggle('hide', t !== 'notes'); $('#tplView').classList.toggle('hide', t !== 'tpl');
  $('#sideToggle').classList.toggle('hide', t !== 'notes');
  if (t === 'tpl') { commitTitle(); saveNow(); if (tts.active) ttsStop(); renderTplList(); renderTplEdit(); }
  else renderList();
}
$('#tabNotes').addEventListener('click', () => showTab('notes'));
$('#tabTpl').addEventListener('click', () => showTab('tpl'));
function renderTplList() {
  const box = $('#tplList'); box.innerHTML = '';
  const ts = D.templates.slice().sort((a, b) => collator.compare(a.name, b.name));
  if (!tplCur && ts.length) tplCur = ts[0].id;
  for (const t of ts) box.append(el('button', { class: 'nrow' + (t.id === tplCur ? ' cur' : ''), onclick: () => { tplCur = t.id; renderTplList(); renderTplEdit(); }, html: `<div class="t"><span>${esc(t.name || '無題')}</span></div>` }));
  if (!ts.length) box.append(el('div', { class: 'empty' }, '＋でテンプレートを追加'));
}
function renderTplEdit() {
  const box = $('#tplEdit'); box.innerHTML = '';
  const t = D.templates.find(x => x.id === tplCur); if (!t) return;
  const nm = el('input', { value: t.name }); const tt = el('input', { value: t.title || '', placeholder: '会議メモ {{日付}}' }); const bd = el('textarea', { spellcheck: 'false' }); bd.value = t.body || '';
  const up = () => { t.name = nm.value; t.title = tt.value; t.body = bd.value; t.updated = Date.now(); saveSoon(); };
  nm.addEventListener('input', up); nm.addEventListener('change', renderTplList); tt.addEventListener('input', up); bd.addEventListener('input', up);
  box.append(el('label', null, 'テンプレート名'), nm, el('label', null, 'ノートのタイトル（{{日付}} は今日の日付になる）'), tt, el('label', null, '本文（Markdown）'), bd,
    el('div', { class: 'btnrow' },
      el('button', { class: 'btn pri', onclick: () => { saveNow(); const d = today(); showTab('notes'); newNote(null, (t.title || t.name || '').split('{{日付}}').join(d), (t.body || '').split('{{日付}}').join(d)); } }, 'このテンプレートで新規ノート'),
      el('button', { class: 'btn dan', onclick: async () => { if (!(await confirmDlg(`テンプレート「${t.name}」を削除しますか？`, '削除', true))) return; D.templates = D.templates.filter(x => x.id !== t.id); D.deleted.templates[t.id] = Date.now(); tplCur = null; saveNow(); renderTplList(); renderTplEdit(); } }, '削除')));
}
$('#tplNew').addEventListener('click', () => { const t = { id: uid(), name: '新しいテンプレート', title: '', body: '', updated: Date.now() }; D.templates.push(t); tplCur = t.id; saveNow(); renderTplList(); renderTplEdit(); });

/* ===== service worker / update ===== */
let swReg = null, updateRequested = false;
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    swReg = reg;
    const show = () => { if (reg.waiting && navigator.serviceWorker.controller) $('#bnUpdate').classList.remove('hide'); };
    show();
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed') show(); }); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading || !updateRequested) return; reloading = true; saveNow(); location.reload(); });
}
$('#bnUpdateBtn').addEventListener('click', () => { saveNow(); updateRequested = true; if (swReg && swReg.waiting) swReg.waiting.postMessage('skipWaiting'); else location.reload(); });

/* ===== init ===== */
function init() {
  load();
  modeNow = isNarrow() ? 'view' : (P.mode || 'split');
  $('#sort').value = P.sort;
  buildFmt();
  [$('#copyBtn'), $('#copySrcBtn'), $('#copyPvBtn')].forEach(b => setCopyIcon(b, false));
  updatePlayIcon();
  applyLayout();
  mq.addEventListener('change', () => { applyLayout(); if (!isNarrow()) document.body.classList.remove('kb'); if (cur) openNote(cur, { mode: isNarrow() ? 'view' : (P.mode || 'split') }); });
  renderList();
  if (!isNarrow()) { const first = sortNotes(D.notes.slice())[0]; openNote(first ? first.id : null); }
  else $('#noNote').classList.add('hide');
  checkBackup();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist(); }).catch(() => {});
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
}
init();
